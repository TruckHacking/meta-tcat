name: Build TCAT Image

on:
  push:
    branches: [ scarthgap ]
  pull_request:
    branches: [ scarthgap ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Requires a self-hosted runner with enough disk space and CPU for
    # Yocto/bitbake builds.  Default GitHub-hosted runners do not have
    # sufficient resources.
    runs-on: [self-hosted, linux, x64]

    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout meta-tcat
        uses: actions/checkout@v4

      - name: Create build workspace
        run: |
          mkdir -p "$HOME/tcat-dev"
          cp tcat-setup-dev-env.sh "$HOME/tcat-dev/"

      - name: Run tcat-setup-dev-env.sh
        working-directory: /home/runner/tcat-dev
        run: |
          chmod +x tcat-setup-dev-env.sh
          ./tcat-setup-dev-env.sh

      - name: Use current branch for meta-tcat
        run: |
          rm -rf "$HOME/tcat-dev/Yocto/meta-tcat"
          cp -r "$GITHUB_WORKSPACE" "$HOME/tcat-dev/Yocto/meta-tcat"

      - name: Create placeholder SAE standard files
        run: |
          # The real SAE standard files (J1939db.json, J1587_201301.pdf.txt,
          # J1708_201609.pdf.txt) are proprietary and cannot be stored in the
          # repository. Create empty placeholders so the build can proceed.
          # For a production build, provide the real files via the steps
          # described in the README.
          touch "$HOME/tcat-dev/Yocto/meta-tcat/recipes-core/base-files/files/J1939db.json"
          touch "$HOME/tcat-dev/Yocto/meta-tcat/recipes-core/base-files/files/J1587_201301.pdf.txt"
          touch "$HOME/tcat-dev/Yocto/meta-tcat/recipes-core/base-files/files/J1708_201609.pdf.txt"

      - name: Validate build environment
        working-directory: /home/runner/tcat-dev/Yocto
        run: |
          source oe-init-build-env
          bitbake-layers show-layers

      - name: Build core-image
        working-directory: /home/runner/tcat-dev/Yocto
        run: |
          source oe-init-build-env
          bitbake core-image
